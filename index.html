    <!-- Language auto-select: first visit to a Russian hub page (/, /blog, /about) goes to the
         visitor's browser language. Bots are never redirected, and a language picked in the
         switcher (cookie zc_lang) always wins. -->
    <script>
      (function () {
        try {
          var L = ["en", "de", "es", "pt", "it", "fr"];
          var STAY_RU = ["ru", "uk", "be", "kk", "ky", "uz", "tg", "hy", "az", "ka", "tt", "ba", "sah"];
          var path = location.pathname.replace(/\/+$/, "") || "/";
          if (path !== "/" && path !== "/blog" && path !== "/about") return;
          if (/bot|crawl|spider|slurp|preview|facebookexternalhit|embedly|lighthouse|headless|mediapartners|whatsapp|vkshare|chatgpt|claude|perplexity|bingpreview/i.test(navigator.userAgent)) return;
          var saved = (document.cookie.match(/(?:^|; )zc_lang=([a-z]{2})/) || [])[1];
          if (saved) {
            if (saved !== "ru" && L.indexOf(saved) > -1) location.replace("/" + saved + (path === "/" ? "" : path) + location.search + location.hash);
            return;
          }
          if (/(^|[?&])(stay|nolang)(=|&|$)/.test(location.search)) return;
          var prefs = navigator.languages && navigator.languages.length ? navigator.languages : [navigator.language || ""];
          var target = "en";
          for (var i = 0; i < prefs.length; i++) {
            var code = String(prefs[i]).toLowerCase().split("-")[0];
            if (STAY_RU.indexOf(code) > -1) { target = "ru"; break; }
            if (L.indexOf(code) > -1) { target = code; break; }
          }
          if (target !== "ru") location.replace("/" + target + (path === "/" ? "" : path) + location.search + location.hash);
        } catch (e) {}
      })();
    </script>
